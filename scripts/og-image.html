<!doctype html>
<!--
  Source de l'image de partage (public/og-image.png, 1200×630) utilisée par LinkedIn, WhatsApp, Facebook…
  Pour la régénérer après modification (Windows, depuis la racine du projet) :
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars
      --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "%CD%\scripts\og-image.html"
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #080808;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #f5f7fb;
        font-family: 'Inter', sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(255 255 255 / 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 255 255 / 0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 85% 80% at 70% 40%, black 25%, transparent 75%);
      }
      .halo {
        position: absolute;
        right: 40px;
        top: 60px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: rgb(42 75 155 / 0.28);
        filter: blur(90px);
      }
      .top,
      .content,
      .bottom {
        position: relative;
      }
      .logo {
        height: 64px;
        display: block;
      }
      h1 {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 500;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }
      .dots {
        color: #5283da;
      }
      .muted {
        color: #7d8494;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #23262e;
        padding-top: 28px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: #9aa1ae;
      }
      .bottom b {
        color: #5283da;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="halo"></div>
      <div class="top"><img class="logo" src="../public/logo/logo-full.svg" alt="" /></div>
      <div class="content">
        <h1>Ingénieur informatique<span class="dots">…</span><br /><span class="muted">mais pas que.</span></h1>
      </div>
      <div class="bottom">
        <span>Tech <b>·</b> Digital <b>·</b> Création</span>
        <span>Ingénierie · Branding · Web · Formation</span>
      </div>
    </div>
  </body>
</html>
